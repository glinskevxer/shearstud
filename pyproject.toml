[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "shearstud"
version = "0.11.0"
description = "Fatigue accounting and load rating for instrumented steel girder bridges"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer" }]
dependencies = ["click==8.1.8"]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "pytest-xdist==3.6.1",
  "coverage==7.6.10",
  "ruff==0.9.2",
  "mypy==1.14.1",
]

[project.scripts]
shearstud = "shearstud.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/shearstud"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# The test matrix runs on Windows, and an editor there will happily write a
# file back with the other ending. Naming the ending here means the format gate
# catches that on the machine it happened on rather than in CI on Linux.
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_any_explicit = false
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -W error::ResourceWarning"
markers = [
  "geometry: section property arithmetic",
  "loads: live load placement and distribution",
  "signals: strain record conditioning and counting",
  "fatigue: damage accumulation and remaining life",
  "rating: load rating and posting",
  "store: persistence and migrations",
  "program: inspection programme policy",
  "cli: command line surface",
  "tools: repository self checks",
]

[tool.coverage.run]
branch = true
source = ["src/shearstud"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
