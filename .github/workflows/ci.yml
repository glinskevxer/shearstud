name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m shearstud.tools.check_changelog
      - run: python -m shearstud.tools.check_cli
      - run: python -m shearstud.tools.check_constants
      - run: python -m shearstud.tools.check_dataclasses
      - run: python -m shearstud.tools.check_docstrings
      - run: python -m shearstud.tools.check_errors
      - run: python -m shearstud.tools.check_layers
      - run: python -m shearstud.tools.check_migrations
      - run: python -m shearstud.tools.check_naming
      - run: python -m shearstud.tools.check_readme
      - run: python -m shearstud.tools.check_sql
      - run: python -m shearstud.tools.check_tests
      - run: python -m shearstud.tools.check_units
      - run: python -m shearstud.tools.check_wiring

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m shearstud.tools.build_architecture --check
      - run: python -m shearstud.tools.build_commands --check
      - run: python -m shearstud.tools.build_glossary --check
      - run: python -m shearstud.tools.build_lock --check
      - run: python -m shearstud.tools.build_rules --check
      - run: python -m shearstud.tools.schema_dump --check
      - name: fail if regenerating changes anything
        run: |
          python -m shearstud.tools.build_architecture
          python -m shearstud.tools.build_commands
          python -m shearstud.tools.build_glossary
          python -m shearstud.tools.build_lock
          python -m shearstud.tools.build_rules
          python -m shearstud.tools.schema_dump
          git diff --exit-code

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m pytest -p no:cacheprovider -n auto

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: >
          python -m pytest -p no:cacheprovider
          --cov=shearstud --cov-report=term-missing --cov-fail-under=95

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m shearstud.tools.smoke

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build -c constraints.txt
      - run: python -m build
      - name: install the wheel and drive the console script
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          shearstud --version
          shearstud init
          shearstud status
          shearstud check

  release:
    runs-on: ubuntu-latest
    needs: [lint, checks, generated, test, coverage, smoke, package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m shearstud.tools.release_check
